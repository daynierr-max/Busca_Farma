
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FarmaSearch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Leaflet Map library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
        }
        #root {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .bottom-sheet {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Custom Leaflet overrides */
        .leaflet-control-attribution { display: none !important; }
        .leaflet-container { background: #f1f5f9; height: 100%; width: 100%; }
        .custom-div-icon { background: transparent; border: none; }

        /* Marker Animations */
        @keyframes marker-pulse {
            0% { transform: scale(1.25) translateY(0); }
            50% { transform: scale(1.35) translateY(-5px); }
            100% { transform: scale(1.25) translateY(0); }
        }

        @keyframes marker-bounce-in {
            0% { transform: scale(0.5) translateY(0); opacity: 0; }
            70% { transform: scale(1.4) translateY(-15px); opacity: 1; }
            100% { transform: scale(1.25) translateY(0); }
        }

        .marker-selected {
            animation: marker-pulse 2s infinite ease-in-out;
            transform-origin: bottom center;
        }

        .marker-bounce {
            animation: marker-bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }
    </style>
<script type="importmap">
{

  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
